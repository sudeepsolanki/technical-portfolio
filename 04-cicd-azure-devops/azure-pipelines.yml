# Azure DevOps CI/CD Pipeline for Customer API
# Demonstrates: YAML pipelines, variables, stages, environments, approvals

trigger:
  branches:
    include:
      - main
      - develop
      - feature/*
  paths:
    include:
      - src/*
      - tests/*

pr:
  branches:
    include:
      - main
  paths:
    include:
      - src/*
      - tests/*

variables:
  buildConfiguration: 'Release'
  dotnetVersion: '9.0.x'
  azureSubscription: '$(AZURE_SUBSCRIPTION)'
  containerRegistry: '$(CONTAINER_REGISTRY)'
  imageRepository: 'customer-api'
  tag: '$(Build.BuildId)'

stages:
  # Stage 1: Build and Test
  - stage: Build
    displayName: 'Build and Test'
    jobs:
      - job: BuildAndTest
        displayName: 'Build, Test, and Analyze'
        pool:
          vmImage: 'ubuntu-latest'

        steps:
          - task: UseDotNet@2
            displayName: 'Install .NET SDK'
            inputs:
              packageType: 'sdk'
              version: '$(dotnetVersion)'

          - task: DotNetCoreCLI@2
            displayName: 'Restore NuGet packages'
            inputs:
              command: 'restore'
              projects: '**/*.csproj'
              feedsToUse: 'select'

          - task: DotNetCoreCLI@2
            displayName: 'Build solution'
            inputs:
              command: 'build'
              projects: '**/*.csproj'
              arguments: '--configuration $(buildConfiguration) --no-restore'

          - task: DotNetCoreCLI@2
            displayName: 'Run unit tests'
            inputs:
              command: 'test'
              projects: 'tests/**/*.csproj'
              arguments: '--configuration $(buildConfiguration) --no-build --collect:"XPlat Code Coverage" --logger trx --results-directory $(Agent.TempDirectory)/TestResults'

          - task: PublishTestResults@2
            displayName: 'Publish test results'
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: 'VSTest'
              testResultsFiles: '$(Agent.TempDirectory)/TestResults/*.trx'
              testRunTitle: 'Unit Tests'

          - task: PublishCodeCoverageResults@2
            displayName: 'Publish code coverage'
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: '$(Agent.TempDirectory)/TestResults/**/coverage.cobertura.xml'

          - task: DotNetCoreCLI@2
            displayName: 'Publish application'
            inputs:
              command: 'publish'
              publishWebProjects: true
              arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)'
              zipAfterPublish: true

          - task: PublishBuildArtifacts@1
            displayName: 'Publish artifact'
            inputs:
              pathToPublish: '$(Build.ArtifactStagingDirectory)'
              artifactName: 'drop'

  # Stage 2: Docker Build
  - stage: DockerBuild
    displayName: 'Docker Build'
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: BuildImage
        displayName: 'Build Docker Image'
        pool:
          vmImage: 'ubuntu-latest'

        steps:
          - task: UseDotNet@2
            displayName: 'Install .NET SDK'
            inputs:
              packageType: 'sdk'
              version: '$(dotnetVersion)'

          - task: Docker@2
            displayName: 'Build Docker image'
            inputs:
              containerRegistry: '$(containerRegistry)'
              repository: '$(imageRepository)'
              command: 'build'
              Dockerfile: '**/Dockerfile'
              tags: |
                $(tag)
                latest

          - task: Docker@2
            displayName: 'Push to container registry'
            inputs:
              containerRegistry: '$(containerRegistry)'
              repository: '$(imageRepository)'
              command: 'push'
              tags: |
                $(tag)
                latest

  # Stage 3: Deploy to Development
  - stage: DeployDevelopment
    displayName: 'Deploy to Development'
    dependsOn: DockerBuild
    condition: succeeded()
    jobs:
      - deployment: DeployToDev
        displayName: 'Deploy to Development'
        environment: 'development'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebAppContainer@1
                  displayName: 'Deploy to Azure Container Apps'
                  inputs:
                    azureSubscription: '$(azureSubscription)'
                    appName: 'customer-api-dev'
                    containers: '$(containerRegistry)/$(imageRepository):$(tag)'

                - task: AzureCLI@2
                  displayName: 'Run database migrations'
                  inputs:
                    azureSubscription: '$(azureSubscription)'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      echo "Running database migrations..."
                      # az containerapp exec --name customer-api-dev --resource-group rg-dev --command dotnet ef database update

  # Stage 4: Deploy to Staging
  - stage: DeployStaging
    displayName: 'Deploy to Staging'
    dependsOn: DeployDevelopment
    condition: succeeded()
    jobs:
      - deployment: DeployToStaging
        displayName: 'Deploy to Staging'
        environment: 'staging'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebAppContainer@1
                  displayName: 'Deploy to Azure Container Apps'
                  inputs:
                    azureSubscription: '$(azureSubscription)'
                    appName: 'customer-api-staging'
                    containers: '$(containerRegistry)/$(imageRepository):$(tag)'

  # Stage 5: Deploy to Production (requires approval)
  - stage: DeployProduction
    displayName: 'Deploy to Production'
    dependsOn: DeployStaging
    condition: succeeded()
    jobs:
      - deployment: DeployToProd
        displayName: 'Deploy to Production'
        environment: 'production'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebAppContainer@1
                  displayName: 'Deploy to Azure Container Apps'
                  inputs:
                    azureSubscription: '$(azureSubscription)'
                    appName: 'customer-api-prod'
                    containers: '$(containerRegistry)/$(imageRepository):$(tag)'

  # Stage 6: Post-deployment verification
  - stage: Verify
    displayName: 'Post-deployment Verification'
    dependsOn: DeployProduction
    condition: succeeded()
    jobs:
      - job: SmokeTest
        displayName: 'Run Smoke Tests'
        pool:
          vmImage: 'ubuntu-latest'

        steps:
          - task: PowerShell@2
            displayName: 'Health check'
            inputs:
              targetType: 'inline'
              script: |
                $healthUrl = "https://customer-api-prod.azurewebsites.net/health"
                $response = Invoke-WebRequest -Uri $healthUrl -UseBasicParsing
                if ($response.StatusCode -ne 200) {
                  throw "Health check failed"
                }
                Write-Host "Health check passed"
