services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: rabbitmq-diagnostics -q check_port_connectivity
      interval: 10s
      timeout: 5s
      retries: 5

  productservice:
    build:
      context: .
      dockerfile: Dockerfile.product
    container_name: productservice
    ports:
      - "5001:5001"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5001
      - ConnectionStrings__Default=Data Source=/app/products.db
      - RabbitMQ__Host=rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy

  orderservice:
    build:
      context: .
      dockerfile: Dockerfile.order
    container_name: orderservice
    ports:
      - "5002:5002"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5002
      - ConnectionStrings__Default=Data Source=/app/orders.db
      - RabbitMQ__Host=rabbitmq
      - Services__ProductService=http://productservice:5001
      - Services__PaymentService=http://paymentservice:5003
    depends_on:
      rabbitmq:
        condition: service_healthy
      productservice:
        condition: service_started

  paymentservice:
    build:
      context: .
      dockerfile: Dockerfile.payment
    container_name: paymentservice
    ports:
      - "5003:5003"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5003
      - ConnectionStrings__Default=Data Source=/app/payments.db
      - RabbitMQ__Host=rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy

  apigateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: apigateway
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
    depends_on:
      - productservice
      - orderservice
      - paymentservice

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - apigateway
